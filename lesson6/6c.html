<!DOCTYPE html>
<html>
<head>
    <title>6c - HTML and CSS</title>

    <style>
        .title {
            font-family: Arial;
            font-size: 30px;
            font-weight: bold;
        }

        .description {
            font-family: Arial;
            font-size: 18px;
            color: gray;
        }

        .button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <p class="title">
        My Website
    </p>

    <p class="description">
        Welcome to my website. This page uses HTML and CSS.
    </p>

    <button class="button">
        Get Started
    </button>

</body>
</html>
