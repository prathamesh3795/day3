<!DOCTYPE html>
<html>
<head>
    <title>6d - Model 3</title>

    <style>
        .title {
            font-family: Arial;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
        }

        .description {
            font-family: Arial;
            font-size: 18px;
            text-align: center;
            color: #555;
        }

        .link {
            color: #555;
            text-decoration: underline;
        }

        .buttons {
            text-align: center;
            margin-top: 30px;
        }

        .order-button {
            background-color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }

        .demo-button {
            background-color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1 class="title">
        Model 3
    </h1>

    <p class="description">
        Order Online for
        <span class="link">Touchless Delivery</span>
    </p>

    <div class="buttons">

        <button class="order-button">
            ORDER NOW
        </button>

        <button class="demo-button">
            DEMO DRIVE
        </button>

    </div>

</body>
</html>
