<!DOCTYPE html>
<html>
<head>
    <title>5f - Stock Price</title>

    <style>
        .price {
            font-family: Arial;
            font-size: 40px;
            margin-bottom: 5px;
        }

        .currency {
            font-size: 20px;
            color: gray;
        }

        .today {
            color: green;
            font-family: Arial;
            font-size: 20px;
        }

        .after {
            color: gray;
            font-family: Arial;
            font-size: 20px;
        }

        .negative {
            color: red;
        }
    </style>
</head>

<body>

    <p class="price">
        1,049.61
        <span class="currency">USD</span>
    </p>

    <p class="today">
        +18.05 (1.75%) today
    </p>

    <p class="after">
        After hours 1,048.00
        <span class="negative">-1.61 (0.15%)</span>
    </p>

</body>
</html>
