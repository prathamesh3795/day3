<!DOCTYPE html>
<html>
<head>
    <title>Lesson 7g</title>

    <style>
        .container {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 15px;
        }

        .email-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .signup-button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            Sign up
        </div>

        <div class="description">
            Enter your details below to create an account.
        </div>

        <input class="email-input" type="email" placeholder="Email">

        <button class="signup-button">
            Sign Up
        </button>

    </div>

</body>
</html>
