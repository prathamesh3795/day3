<!DOCTYPE html>
<html>
<head>
    <title>Lesson 8e</title>

    <style>
        .title {
            font-size: 36px;
            margin-bottom: 25px;
        }

        .location-input {
            display: block;
            width: 350px;
            padding: 14px;
            margin-bottom: 8px;
            border: none;
            background-color: #f0f0f0;
            font-size: 14px;
            box-sizing: border-box;
        }

        .request-button {
            margin-top: 25px;
            padding: 14px 20px;
            background-color: black;
            color: white;
            border: none;
            font-size: 14px;
        }

        .schedule-button {
            margin-left: 15px;
            padding: 14px 20px;
            background-color: #f0f0f0;
            color: black;
            border: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="title">
        Request a ride now
    </div>

    <input
        class="location-input"
        type="text"
        placeholder="Enter pickup location"
    >

    <input
        class="location-input"
        type="text"
        placeholder="Enter destination"
    >

    <button class="request-button">
        Request now
    </button>

    <button class="schedule-button">
        Schedule for later
    </button>

</body>
</html>
