<!DOCTYPE html>
<html>
<head>
    <title>Lesson 8d</title>

    <style>
        .first-name,
        .last-name {
            width: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .email {
            display: block;
            width: 310px;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .signup-button {
            display: block;
            width: 310px;
            padding: 12px;
            margin-top: 10px;
            background-color: #3875e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <input class="first-name" type="text" placeholder="First name">

    <input class="last-name" type="text" placeholder="First name">

    <input class="email" type="email" placeholder="Email">

    <button class="signup-button">
        Sign Up
    </button>

</body>
</html>
